databases:
  - name: paathnexus-db
    databaseName: paathnexus
    user: paathnexus
    plan: free
    postgresMajorVersion: "17"

services:
  - type: web
    name: paathnexus-api
    runtime: docker
    rootDir: api
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/health/ready
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        value: https://paathnexus-api.onrender.com
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: paathnexus-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://paathnexus-frontend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://paathnexus-frontend.onrender.com
      - key: SANCTUM_TOKEN_EXPIRATION
        value: "60"
      - key: LOG_LEVEL
        value: info
      - key: PAATHNEXUS_PLATFORM_ADMIN_EMAILS
        sync: false

  - type: web
    name: paathnexus-frontend
    runtime: static
    rootDir: .
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: false
    envVars:
      - key: VITE_API_BASE_URL
        value: https://paathnexus-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
